<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Cristina 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600;700&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --cream: #FBF1DA;
    --cream-deep: #F5E4C0;
    --paper: #FFFCF3;
    --ink: #4A3A22;
    --ink-soft: #8A7757;
    --script: #6E8B4B;
    --petal-1: #FBDB6B;
    --petal-2: #F6C445;
    --petal-3: #E4A11B;
    --petal-tip: #D6870A;
    --center-1: #A9702F;
    --center-2: #6B4423;
    --center-3: #4A2E17;
    --daisy-center: #F2B233;
    --leaf-1: #8FAE63;
    --leaf-2: #67833F;
    --rose: #EFA3B4;
    --rose-deep: #C85D74;
    --pup-body: #F1E0BF;
    --pup-ear: #D8B27E;
    --pup-ink: #5C4530;
    --pup-blush: #F3B6C0;
    --line: rgba(74,58,34,.15);
    --shadow: rgba(90,63,25,.22);
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-script: 'Caveat', 'Segoe Script', cursive;
    --font-body: 'Karla', 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream: #211a10; --cream-deep: #2a2114; --paper: #251e13;
      --ink: #F3E7CC; --ink-soft: #C9B896; --line: rgba(246,236,214,.16); --shadow: rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --cream: #211a10; --cream-deep: #2a2114; --paper: #251e13;
    --ink: #F3E7CC; --ink-soft: #C9B896; --line: rgba(246,236,214,.16); --shadow: rgba(0,0,0,.55);
  }

  *{ box-sizing: border-box; }
  html{ height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin: 0; min-height: 100dvh; background: var(--cream); color: var(--ink);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  :focus-visible{ outline: 2px solid var(--rose-deep); outline-offset: 3px; border-radius: 4px; }
  button{ font-family: inherit; }

  .paper-bg{
    position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 0%, var(--cream-deep), transparent 60%),
      radial-gradient(ellipse 100% 70% at 50% 100%, var(--cream-deep), transparent 65%),
      repeating-radial-gradient(circle at 30% 20%, rgba(0,0,0,.012) 0, rgba(0,0,0,.012) 1px, transparent 1px, transparent 3px);
    background-color: var(--cream);
  }

  .petals-field{ position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .petal{
    position: absolute; top: -8%; width: 13px; height: 13px;
    background: linear-gradient(160deg, var(--petal-1), var(--petal-3));
    border-radius: 2px 12px 2px 12px; opacity: .7;
    animation-name: fall, sway; animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  .petal.heart-petal{
    background: none; border-radius: 0; font-size: 15px; line-height: 1; color: var(--rose-deep); opacity: .55;
    width: auto; height: auto;
  }
  @keyframes fall{ from{ transform: translateY(-10vh) rotate(0deg); } to{ transform: translateY(112vh) rotate(300deg); } }
  @keyframes sway{ 0%,100%{ margin-left: 0px; } 50%{ margin-left: 30px; } }
  @media (prefers-reduced-motion: reduce){ .petal{ animation-duration: 45s !important; opacity: .35; } }

  .dots{
    position: fixed; top: calc(16px + env(safe-area-inset-top,0px)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 6;
  }
  .dots span{ width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .3s ease, transform .3s ease; }
  .dots span.on{ background: var(--petal-tip); transform: scale(1.3); }

  #screens{ position: relative; z-index: 2; }
  .screen{
    min-height: 100dvh; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: calc(56px + env(safe-area-inset-top,0px)) 24px calc(40px + env(safe-area-inset-bottom,0px));
    opacity: 0; transform: scale(.98); transition: opacity .5s ease, transform .5s ease;
  }
  .screen.active{ display: flex; opacity: 1; transform: scale(1); }
  .screen.scrollable{ display: flex; min-height: 100dvh; height: auto; justify-content: flex-start; }

  .sparkle{ font-size: 20px; opacity: .8; margin-bottom: 2px; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.5; transform: scale(1);} 50%{ opacity:1; transform: scale(1.15);} }

  .pre-label{ font-family: var(--font-script); font-size: clamp(22px,5vw,28px); color: var(--script); margin: 4px 0 0; }
  .big-name{
    font-family: var(--font-display); font-style: italic; font-weight: 500;
    font-size: clamp(42px, 11vw, 68px); line-height: 1.05; color: var(--ink); margin: 2px 0 22px;
  }
  .hearts-initials{
    position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 26px;
    animation: heartbeat 2.2s ease-in-out infinite;
  }
  @keyframes heartbeat{ 0%,100%{ transform: scale(1);} 14%{ transform: scale(1.07);} 28%{ transform: scale(1);} 42%{ transform: scale(1.05);} 56%{ transform: scale(1);} }
  .heart-badge{ width: 78px; height: auto; margin: 0 -6px; filter: drop-shadow(0 8px 14px var(--shadow)); }
  .heart-badge.left{ transform: rotate(-6deg); }
  .heart-badge.right{ transform: rotate(6deg); }
  .heart-badge .letter{ font-family: var(--font-display); font-weight: 600; font-size: 26px; fill: var(--ink); }
  .ribbon-mini{ width: 46px; margin: 0 -2px -18px; position: relative; z-index: 2; filter: drop-shadow(0 4px 8px var(--shadow)); }

  .flower-row{ display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
  .flower-row svg{ display: block; filter: drop-shadow(0 6px 10px var(--shadow)); }
  .flower-row .fr-sm svg{ width: 40px; }
  .flower-row .fr-md svg{ width: 54px; }
  .flower-row .fr-lg svg{ width: 70px; margin-bottom: 8px; }

  .cta-btn{
    background: var(--script); color: var(--paper); border: none; font-weight: 600; font-size: 16px;
    letter-spacing: .01em; padding: 15px 34px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 12px 26px var(--shadow); transition: transform .2s ease;
  }
  .cta-btn:active{ transform: scale(.96); }
  .cta-btn.ghost{ background: transparent; color: var(--script); border: 1.5px solid var(--script); box-shadow: none; }

  /* ---- puppy illustration ---- */
  .puppy-wrap{ position: relative; width: 128px; margin: 0 auto 8px; animation: puppy-bob 3.2s ease-in-out infinite; }
  @keyframes puppy-bob{ 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-4px) rotate(-2deg);} }
  .puppy-wrap svg.puppy{ width: 100%; display: block; filter: drop-shadow(0 8px 14px var(--shadow)); }
  .puppy-flower{ position: absolute; width: 30px; right: -6px; bottom: 34px; filter: drop-shadow(0 4px 6px var(--shadow)); }

  /* ---- teaser screen ---- */
  .teaser-line{
    font-family: var(--font-script); font-size: clamp(25px, 5.6vw, 34px); color: var(--script);
    max-width: 380px; line-height: 1.35; min-height: 2.7em; margin: 6px 0 22px;
  }
  .teaser-line .cursor, .typewriter-line .cursor, .para-block p .cursor{
    display:inline-block; width:2px; background:var(--ink); margin-left:2px; animation: blink 1s steps(1) infinite; vertical-align:-2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .teaser-bouquet{ margin: 6px 0 30px; opacity: 0; transform: translateY(14px) scale(.92); transition: opacity .9s ease, transform .9s cubic-bezier(.34,1.1,.4,1); }
  .teaser-bouquet.shown{ opacity: 1; transform: translateY(0) scale(1); }

  /* ---- big bouquet reveal screen ---- */
  .bouquet-caption{
    font-family: var(--font-script); font-size: clamp(25px, 5.6vw, 34px); color: var(--script);
    max-width: 380px; line-height: 1.35; min-height: 1.6em; margin: 6px 0 18px;
  }
  .bouquet-subcaption{
    font-family: var(--font-display); font-style: italic; font-weight: 300; font-size: 16px;
    color: var(--ink-soft); margin: 0 0 26px; opacity: 0; transition: opacity .8s ease .2s;
  }
  .bouquet-subcaption.shown{ opacity: 1; }
  .big-bouquet{
    position: relative; width: min(80vw, 300px); height: 250px; margin: 0 auto 30px;
  }
  .bb-leaf{ position: absolute; width: 58px; height: 24px; background: var(--leaf-1); border-radius: 0 100% 0 100%; bottom: 34px; opacity: 0; transform: scale(.5); transition: opacity .6s ease, transform .6s cubic-bezier(.34,1.4,.4,1); }
  .bb-leaf-1{ left: 18%; transform: rotate(-30deg) scale(.5); }
  .bb-leaf-2{ right: 16%; transform: rotate(30deg) scaleX(-1) scale(.5); }
  .big-bouquet.shown .bb-leaf-1{ opacity: .9; transform: rotate(-30deg) scale(1); }
  .big-bouquet.shown .bb-leaf-2{ opacity: .9; transform: rotate(30deg) scaleX(-1) scale(1); }
  .bb-flower{
    position: absolute; filter: drop-shadow(0 10px 16px var(--shadow));
    opacity: 0; transform: scale(.25); transition: opacity .7s ease, transform .7s cubic-bezier(.34,1.5,.4,1);
  }
  .big-bouquet.shown .bb-flower{ opacity: 1; transform: scale(1); }
  .bb-f1{ width: 40%; left: 30%; top: 0; transition-delay: .05s; }
  .bb-f2{ width: 32%; left: 1%; top: 20%; transition-delay: .18s; }
  .bb-f2 svg, .bb-f2{ transform-origin: 50% 80%; }
  .big-bouquet.shown .bb-f2{ transform: rotate(-9deg) scale(1); }
  .bb-f3{ width: 32%; left: 66%; top: 18%; transition-delay: .26s; }
  .big-bouquet.shown .bb-f3{ transform: rotate(9deg) scale(1); }
  .bb-f4{ width: 25%; left: 10%; top: 48%; transition-delay: .34s; }
  .big-bouquet.shown .bb-f4{ transform: rotate(-7deg) scale(1); }
  .bb-f5{ width: 25%; left: 70%; top: 50%; transition-delay: .4s; }
  .big-bouquet.shown .bb-f5{ transform: rotate(7deg) scale(1); }
  .bb-f6{ width: 34%; left: 33%; top: 44%; transition-delay: .12s; }
  .bb-ribbon{ position: absolute; width: 70px; left: 50%; bottom: 4px; transform: translateX(-50%) scale(.4); opacity: 0; transition: opacity .6s ease .5s, transform .6s cubic-bezier(.34,1.5,.4,1) .5s; filter: drop-shadow(0 4px 8px var(--shadow)); }
  .big-bouquet.shown .bb-ribbon{ opacity: 1; transform: translateX(-50%) scale(1); }

  /* ---- envelope screen ---- */
  .typewriter-line{
    font-family: var(--font-script); font-size: clamp(24px, 5.4vw, 32px); color: var(--script);
    min-height: 1.4em; margin: 0 0 40px; max-width: 340px;
  }
  .envelope-wrap{ perspective: 900px; }
  .envelope-btn{ background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .envelope{ position: relative; width: min(78vw, 280px); aspect-ratio: 3/2; transform-style: preserve-3d; }
  .envelope-body{
    position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(155deg, var(--paper), var(--cream-deep));
    box-shadow: 0 16px 34px var(--shadow), inset 0 0 0 1px var(--line);
  }
  .envelope-body::before, .envelope-body::after{
    content:""; position:absolute; bottom:0; width:52%; height:78%;
    background: linear-gradient(160deg, rgba(0,0,0,.05), transparent 60%);
    clip-path: polygon(0 100%, 100% 100%, 0 0);
  }
  .envelope-body::before{ left:0; }
  .envelope-body::after{ right:0; transform: scaleX(-1); }
  .envelope-flap{
    position: absolute; top: 0; left: 0; width: 100%; height: 62%;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(200deg, var(--cream-deep), var(--paper));
    box-shadow: inset 0 0 0 1px var(--line);
    transform-origin: 50% 0%; transform: rotateX(0deg);
    transition: transform .85s cubic-bezier(.6,.05,.25,1); backface-visibility: hidden;
  }
  .envelope.open .envelope-flap{ transform: rotateX(-172deg); }
  .envelope-seal{
    position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(1);
    width: 54px; height: 54px; z-index: 3; transition: opacity .4s ease, transform .4s ease;
  }
  .envelope.open .envelope-seal{ opacity: 0; transform: translate(-50%,-50%) scale(.5); }
  .envelope-letter{
    position: absolute; left: 50%; top: 16%; width: 74%; height: 70%;
    background: var(--paper); border-radius: 3px; box-shadow: 0 6px 18px var(--shadow);
    transform: translate(-50%, 6%) scale(.88); opacity: 0;
    transition: transform .8s cubic-bezier(.34,1.2,.4,1) .35s, opacity .6s ease .35s;
  }
  .envelope.open .envelope-letter{ transform: translate(-50%, -46%) scale(1); opacity: 1; }
  .envelope-letter .line{ height: 3px; background: var(--line); margin: 16% 14% 0; border-radius: 2px; }
  .envelope-letter .line.short{ width: 55%; }
  .hint{ font-size: 14px; color: var(--ink-soft); margin-top: 22px; }

  .letter-inner{ max-width: 600px; width:100%; margin: 0 auto; padding: 0 26px 90px; }
  .letter-head{
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; color: var(--ink-soft);
    margin: 8px 0 34px;
  }
  .letter-head b{ color: var(--ink); font-weight: 600; }

  .para-block{
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;
    margin: 0 auto 50px; max-width: 560px;
  }
  .para-block .mini-flower{ width: 42px; height: 42px; opacity: .3; transition: opacity .6s ease; }
  .para-block.in-view .mini-flower{ opacity: 1; }
  .para-block p{
    font-family: var(--font-display); font-weight: 300; font-size: clamp(17px, 3.3vw, 20px);
    line-height: 1.75; color: var(--ink); margin: 0; min-height: 1.75em;
  }
  .para-block.pull-quote p{
    font-family: var(--font-script); font-size: clamp(26px, 5.6vw, 34px); line-height: 1.35;
    color: var(--rose-deep); font-weight: 600;
  }

  .bouquet-wrap{ display:flex; justify-content:center; margin: 6px 0 40px; }
  .bouquet{ display: flex; align-items: flex-end; gap: 0px; position: relative; padding-bottom: 6px; }
  .bouquet button{ background:none; border:none; padding:4px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bouquet svg{ display:block; filter: drop-shadow(0 8px 14px var(--shadow)); }
  .bouquet .fr-sm svg{ width: 40px; }
  .bouquet .fr-md svg{ width: 58px; }
  .bouquet .fr-lg svg{ width: 88px; margin-bottom: 10px; }
  .bouquet button{ animation: breathe 5s ease-in-out infinite; }
  .bouquet button:nth-child(2){ animation-delay: .3s; }
  .bouquet button:nth-child(3){ animation-delay: .6s; }
  .bouquet button:nth-child(4){ animation-delay: .9s; }
  .bouquet-ribbon{ width: 38px; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); filter: drop-shadow(0 4px 8px var(--shadow)); }
  @keyframes breathe{ 0%,100%{ transform: scale(1) rotate(0deg); } 50%{ transform: scale(1.035) rotate(-1deg); } }

  .signature{ text-align: center; margin: 6px auto 40px; }
  .signature p{ font-family: var(--font-script); color: var(--ink); margin: 0; }
  .signature .line1{ font-size: clamp(19px, 4vw, 24px); color: var(--ink-soft); }
  .signature .line2{ font-size: clamp(20px, 4.4vw, 26px); color: var(--ink-soft); margin-top: 2px; }
  .signature .line3{ font-size: clamp(32px, 6.6vw, 44px); color: var(--petal-tip); margin-top: 8px; }

  .heart-wrap{ display: flex; justify-content: center; margin: 0 0 46px; }
  .heart-button{
    display: inline-flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line);
    color: var(--rose-deep); font-weight: 600; font-size: 15px; padding: 14px 24px; border-radius: 999px;
    cursor: pointer; box-shadow: 0 10px 24px var(--shadow); transition: transform .25s ease; -webkit-tap-highlight-color: transparent;
  }
  .heart-button:active{ transform: scale(.96); }
  .heart-button svg{ width: 20px; height: 20px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.18); } }

  .footer-puppy{ display:flex; flex-direction:column; align-items:center; margin-bottom: 10px; }
  .footer-seal{ display:flex; flex-direction:column; align-items:center; gap:6px; padding-bottom: 20px; }
  .footer-seal svg{ width: 40px; opacity:.75; }
  .footer-note{ font-family: var(--font-script); font-size: 17px; color: var(--ink-soft); margin:0; }

  .music-toggle{
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6;
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper);
    color: var(--rose-deep); display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 10px 22px var(--shadow); -webkit-tap-highlight-color: transparent;
  }
  .music-toggle svg{ width: 22px; height: 22px; }
  .music-toggle .icon-pause{ display: none; }
  .music-toggle.playing .icon-play{ display: none; }
  .music-toggle.playing .icon-pause{ display: block; }
  .music-toggle.playing{ animation: pulse 2.4s ease-in-out infinite; }

  .burst-item{ position: fixed; pointer-events: none; z-index: 7; font-size: 20px; animation: burst-rise 1.5s ease-out forwards; }
  @keyframes burst-rise{
    0%{ transform: translate(0,0) scale(.6) rotate(0deg); opacity: 1; }
    100%{ transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }
</style>
</head>
<body>

<div class="paper-bg" aria-hidden="true"></div>
<div class="petals-field" id="petalsField" aria-hidden="true"></div>
<div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div id="screens">

  <!-- SCREEN 1: cover -->
  <section class="screen active" id="screenCover" data-screen="0">
    <div class="sparkle">✨</div>
    <p class="pre-label">Para</p>
    <h1 class="big-name">Cristina</h1>

    <div class="hearts-initials">
      <svg class="heart-badge left" viewBox="0 0 100 92"><path d="M50 88C25 70 4 52 4 30 4 14 16 3 31 3c9 0 16 5 19 12 3-7 10-12 19-12 15 0 27 11 27 27 0 22-21 40-46 58Z" fill="var(--petal-2)" stroke="var(--petal-tip)" stroke-width="2"/><text x="50" y="56" text-anchor="middle" class="letter">C</text></svg>
      <svg class="ribbon-mini" viewBox="0 0 60 40"><path d="M30 20 L6 6 Q2 4 4 10 L10 20 L4 30 Q2 36 6 34 L30 20Z" fill="var(--rose)"/><path d="M30 20 L54 6 Q58 4 56 10 L50 20 L56 30 Q58 36 54 34 L30 20Z" fill="var(--rose-deep)"/><circle cx="30" cy="20" r="5" fill="var(--rose-deep)"/></svg>
      <svg class="heart-badge right" viewBox="0 0 100 92"><path d="M50 88C25 70 4 52 4 30 4 14 16 3 31 3c9 0 16 5 19 12 3-7 10-12 19-12 15 0 27 11 27 27 0 22-21 40-46 58Z" fill="var(--petal-2)" stroke="var(--petal-tip)" stroke-width="2"/><text x="50" y="56" text-anchor="middle" class="letter">C</text></svg>
    </div>

    <div class="flower-row" aria-hidden="true" style="margin-bottom:30px;">
      <div class="fr-sm"><svg viewBox="0 0 300 300" data-flower="daisy"></svg></div>
      <div class="fr-md"><svg viewBox="0 0 300 300" data-flower="sun"></svg></div>
      <div class="fr-lg"><svg viewBox="0 0 300 300" data-flower="sun"></svg></div>
      <div class="fr-md"><svg viewBox="0 0 300 300" data-flower="sun"></svg></div>
      <div class="fr-sm"><svg viewBox="0 0 300 300" data-flower="daisy"></svg></div>
    </div>

    <button class="cta-btn" id="toTeaserBtn">Ver regalo</button>
  </section>

  <!-- SCREEN 2: teaser -->
  <section class="screen" id="screenTeaser" data-screen="1">
    <div class="puppy-wrap" id="puppySlotTeaser" aria-hidden="true"></div>

    <p class="teaser-line" id="teaserTyped" data-text="Cada flor que ves aquí guarda una parte de lo que siento por ti."></p>

    <div class="flower-row teaser-bouquet" id="teaserBouquet" aria-hidden="true">
      <div class="fr-sm"><svg viewBox="0 0 300 300" data-flower="daisy"></svg></div>
      <div class="fr-md"><svg viewBox="0 0 300 300" data-flower="sun"></svg></div>
      <div class="fr-lg"><svg viewBox="0 0 300 300" data-flower="sun"></svg></div>
      <div class="fr-md"><svg viewBox="0 0 300 300" data-flower="daisy"></svg></div>
      <div class="fr-sm"><svg viewBox="0 0 300 300" data-flower="sun"></svg></div>
    </div>

    <button class="cta-btn ghost" id="toBouquetBtn">Sigue leyendo</button>
  </section>

  <!-- SCREEN 3: big bouquet reveal -->
  <section class="screen" id="screenBouquet" data-screen="2">
    <p class="bouquet-caption" id="bouquetTyped" data-text="Un ramo de girasoles, solo para ti."></p>
    <p class="bouquet-subcaption" id="bouquetSub">porque mereces algo tan brillante como tú 🌻</p>

    <div class="big-bouquet" id="bigBouquet" aria-hidden="true">
      <div class="bb-leaf bb-leaf-1"></div>
      <div class="bb-leaf bb-leaf-2"></div>
      <svg class="bb-flower bb-f2" viewBox="0 0 300 300" data-flower="sun"></svg>
      <svg class="bb-flower bb-f3" viewBox="0 0 300 300" data-flower="sun"></svg>

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var order = ["cover", "teaser", "bouquet", "envelope", "letter"];
  var screens = {
    cover: document.getElementById("screenCover"),
    teaser: document.getElementById("screenTeaser"),
    bouquet: document.getElementById("screenBouquet"),
    envelope: document.getElementById("screenEnvelope"),
    letter: document.getElementById("screenLetter")

  var dotEls = document.querySelectorAll("#dots span");

  function updateDots(name){
    var idx = order.indexOf(name);
    if (name === "letter"){ document.getElementById("dots").style.display = "none"; return; }
    document.getElementById("dots").style.display = "flex";
    dotEls.forEach(function(d, i){ d.classList.toggle("on", i === idx); });
  }

  function goTo(name){
    Object.keys(screens).forEach(function(k){
      if (k === name){
        screens[k].style.display = "flex";
        requestAnimationFrame(function(){ screens[k].classList.add("active"); });

        screens[k].classList.remove("active");

    window.scrollTo({ top: 0, behavior: "auto" });

  function typeInto(el, text, speed, onDone){
    if (reduceMotion){ el.textContent = text; if (onDone) onDone(); return; }
    var i = 0;
    el.textContent = "";
    var cursor = document.createElement("span");
    cursor.className = "cursor";
    el.appendChild(cursor);
    var timer = setInterval(function(){
      if (i < text.length){ cursor.insertAdjacentText("beforebegin", text.charAt(i)); i++; }
      else { clearInterval(timer); cursor.remove(); if (onDone) onDone(); }
    }, speed);
  }

  /* ---------------- gentle original melody (Web Audio API) ---------------- */
  var audioCtx = null, isPlaying = false, timers = [], padNodes = null;
  var SCALE = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25];
  var MELODY = [0,2,1,4,3,2,5,4,2,1,0,3];

  function makeVoice(freq, when, dur, peak){
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();

    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(peak, when + 0.35);
    gain.gain.exponentialRampToValueAtTime(0.0008, when + dur);

    osc.start(when); osc.stop(when + dur + 0.05);
  }
  function startPad(){
    var o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();

    o2.type = "sine"; o2.frequency.value = SCALE[3] / 2;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2.5);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(audioCtx.destination);
    o1.start(); o2.start();
    return { o1: o1, o2: o2, g: g };

  function stopPad(nodes){

    nodes.g.gain.cancelScheduledValues(t);

    nodes.g.gain.linearRampToValueAtTime(0, t + 1.2);

  }
  function scheduleMelodyLoop(){
    var step = 0.62, now = audioCtx.currentTime + 0.2;
    MELODY.forEach(function(idx, i){ makeVoice(SCALE[idx], now + i * step, step * 1.6, 0.09); });
    var t = setTimeout(function(){ if (isPlaying) scheduleMelodyLoop(); }, MELODY.length * step * 1000);
    timers.push(t);
  }
  var musicToggle = document.getElementById("musicToggle");
  musicToggle.addEventListener("click", function(){
    if (!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === "suspended"){ audioCtx.resume(); }
    if (!isPlaying){
      isPlaying = true; musicToggle.classList.add("playing");
      musicToggle.setAttribute("aria-pressed", "true"); musicToggle.setAttribute("aria-label", "Pausar la música");
      padNodes = startPad(); scheduleMelodyLoop();
    } else {
      isPlaying = false; musicToggle.classList.remove("playing");
      musicToggle.setAttribute("aria-pressed", "false"); musicToggle.setAttribute("aria-label", "Reproducir música suave");
      timers.forEach(clearTimeout); timers = []; stopPad(padNodes);
    }
  });

  updateDots("cover");
})();
</script>
</body>
</html>
